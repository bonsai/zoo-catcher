name: game-design-automation

on:
  schedule:
    # 毎週月曜 09:00 UTC（日本時間 18:00）
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      steps:
        description: "CAMEL 会話ステップ数"
        required: false
        default: "4"
        type: string
      model:
        description: "OpenRouter 無料モデル slug"
        required: false
        default: "openrouter/free"
        type: string

permissions:
  contents: write

jobs:
  game-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CAMEL
        run: |
          pip install --quiet "camel-ai==0.2.90"

      - name: Run game design iteration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: "true"
          CAMEL_STEPS: ${{ inputs.steps || '4' }}
          CAMEL_MODEL: ${{ inputs.model || 'openrouter/free' }}
        run: |
          bash design/run_iteration.sh
