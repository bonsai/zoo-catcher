<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Flashlight Game</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    cursor:crosshair;
}

button{
    position:absolute;
    top:10px;
    left:10px;
    z-index:1000;
    font-size:20px;
    padding:8px 20px;
}

#room{
    position:relative;
    width:100%;
    height:100%;
}

.animal{
    position:absolute;
    font-size:28px;
    opacity:0;
    transition:left .2s linear, top .2s linear;
}
</style>
</head>

<body>

<button onclick="lightOn()">🔦 ON</button>

<div id="room">
    <div class="animal" id="rabbit">🐰</div>
    <div class="animal">🦘</div>
    <div class="animal">🐸</div>
    <div class="animal">🦗</div>
</div>

<script>

let light=false;
let timer;
const R=70;
const animals=document.querySelectorAll(".animal");

animals.forEach(move);

function move(a){
    a.style.left=Math.random()*(innerWidth-40)+"px";
    a.style.top=Math.random()*(innerHeight-40)+"px";
}

setInterval(()=>{
    animals.forEach(move);
},300);

function lightOn(){

    light=true;

    clearTimeout(timer);

    timer=setTimeout(()=>{
        light=false;
        animals.forEach(a=>a.style.opacity=0);
    },5000);
}

document.addEventListener("mousemove",e=>{

    if(!light)return;

    document.body.style.background=
    `radial-gradient(circle ${R}px at ${e.clientX}px ${e.clientY}px,
    rgba(255,255,255,0.9) 0,
    rgba(255,255,255,0.4) ${R*0.6}px,
    black ${R}px)`;

    animals.forEach(a=>{

        const x=a.offsetLeft+14;
        const y=a.offsetTop+14;

        const d=Math.hypot(e.clientX-x,e.clientY-y);

        a.style.opacity=(d<R)?1:0;

    });

});

</script>

</body>
</html>
